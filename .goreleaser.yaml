version: 2

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # GoReleaser's default ldflags set -X main.version and friends, which this
    # program does not have: the version in the About panel comes from the tag
    # Go itself stamps into the binary. -s -w drops the symbol table and DWARF
    # and leaves that build information intact.
    ldflags:
      - -s -w

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

# Only the Linux builds end up here; nfpm ignores the rest.
nfpms:
  - package_name: justwrite
    vendor: Mauricio Cerón
    maintainer: Mauricio Cerón <ceron.maw@gmail.com>
    homepage: https://github.com/MawCeron/justwrite
    description: A minimal, distraction-free terminal text editor.
    license: MIT
    section: editors
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/doc/justwrite/copyright
      - src: README.md
        dst: /usr/share/doc/justwrite/README.md

changelog:
  abbrev: -1
  filters:
    exclude:
      - '^docs'
      - '^test'
      - '^ci'
      - '^chore'
      - '^build'
      - '^refactor'
      - '^Merge '
